model_list:
  - model_name: fusion-moa-v0948-general
    litellm_params:
      model: openai/fusion-moa-v0948-general
      api_base: http://127.0.0.1:19036/v1
      api_key: local-gateway-placeholder
      use_chat_completions_api: true
      temperature: 0.6
      top_p: 0.95
      presence_penalty: 0.0
      max_tokens: 16384
      timeout: 7200
      extra_body:
        top_k: 20
        min_p: 0.0
        repetition_penalty: 1.0
        chat_template_kwargs:
          enable_thinking: true
          reasoning_effort: medium
        moa:
          mode: initial_panel
litellm_settings:
  use_chat_completions_url_for_anthropic_messages: true
  drop_params: true
  callbacks: [callback.proxy_handler_instance]
general_settings:
  disable_spend_logs: true
